<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Estudiantes</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="login-header">
                <h1>🎓 Sistema de Estudiantes</h1>
                <p>UNHEVAL - Ingeniería Industrial</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">👤 Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="Ingrese su usuario">
                </div>
                
                <div class="input-group">
                    <label for="password">🔒 Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
                </div>
                
                <button type="submit" class="btn-login">
                    Ingresar
                </button>
                
                <div id="mensaje" class="mensaje"></div>
            </form>
            
            <div class="login-footer">
                <p>💡 Usuario de prueba: <strong>admin</strong> / <strong>12345</strong></p>
            </div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
